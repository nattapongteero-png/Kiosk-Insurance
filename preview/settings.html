<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiosk — ตั้งค่าตู้</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14265A; --ink-muted:#5B6B8A; --ink-soft:#8494AE;
  --blue:#1E7BE0; --blue-deep:#0D5BC6; --blue-050:#EAF3FD;
  --green:#1E9C78; --green-050:#E8F7F2;
  --gold:#A87C2A; --gold-050:#FBF3E2;
  --line:#D7E4F2; --gutter:80px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#161A1F;font-family:"Noto Sans Thai",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:20px 12px}
.stage{width:1080px;height:var(--H,1920px);transform-origin:top center;flex:none}
.screen{position:relative;width:1080px;height:var(--H,1920px);overflow:hidden;border-radius:10px;
  background:#EAF2FB url("bg_home.png") center/cover no-repeat;box-shadow:0 30px 90px rgba(0,0,0,.5);color:var(--ink)}
.screen::before{content:"";position:absolute;inset:0;background:rgba(255,255,255,.9)}
body.bleed{padding:0;overflow:hidden}
body.bleed .screen{border-radius:0;box-shadow:none}
button{font:inherit;color:inherit}

/* ================= หน้าตั้งค่าตู้ (สำหรับเจ้าหน้าที่) =================
   Pain point เดิม: รายการกว่า 140 ข้อเรียงยาวหน้าเดียว หาไม่เจอ · มีรายการซ้ำ · สลับคำ "เปิด/ปิด"
   ใหม่: ค้นหาได้ทันที → แบ่ง 9 หมวด (การ์ดบอกจำนวนรายการ/ที่เปิดอยู่) → ในหมวดแยกหัวข้อย่อย · รายการซ้ำรวมเหลืออันเดียว */
.hd{position:absolute;left:0;right:0;top:0;z-index:3;padding:64px var(--gutter) 0}
.hd .top{display:flex;align-items:center;gap:24px}
.hd .gic{width:88px;height:88px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 28%,#FFFFFF 0%,#FEFBF5 55%,#F7F1E4 100%);
  box-shadow:0 0 0 1.5px rgba(191,145,58,.42),0 0 0 9px rgba(191,145,58,.06),0 10px 22px rgba(120,92,30,.14)}
.hd .gic svg{width:44px;height:44px;stroke:var(--gold)}
.hd h1{font-size:48px;font-weight:700;line-height:60px}
.hd .sub{font-size:24px;color:var(--ink-muted);line-height:34px}
.hd .x{margin-left:auto;width:88px;height:88px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;background:rgba(20,38,90,.06)}
.hd .x svg{width:40px;height:40px;stroke:var(--ink-muted)}
.search{margin-top:40px;display:flex;align-items:center;gap:16px;height:96px;padding:0 32px;border-radius:99px;background:#fff;
  box-shadow:0 0 0 1.5px rgba(191,145,58,.4),0 10px 24px rgba(20,38,90,.08)}
.search svg{width:36px;height:36px;stroke:var(--ink-soft);flex:none}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:30px;color:var(--ink)}
.search input::placeholder{color:var(--ink-soft)}
.search .clr{width:56px;height:56px;border-radius:50%;border:0;background:rgba(20,38,90,.06);cursor:pointer;display:grid;place-items:center}
.search .clr svg{width:28px;height:28px}
.body{position:absolute;left:0;right:0;top:340px;bottom:0;overflow-y:auto;padding:24px var(--gutter) 120px;z-index:2;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 24px);mask-image:linear-gradient(180deg,transparent 0,#000 24px)}
.body::-webkit-scrollbar{display:none}
.lbl{font-size:26px;font-weight:600;color:var(--ink-muted);margin:8px 0 20px}

/* การ์ดหมวด 2 คอลัมน์ */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.gcard{display:flex;flex-direction:column;gap:12px;padding:32px;border-radius:32px;border:0;cursor:pointer;text-align:left;
  background:linear-gradient(176deg,#FFFFFF 0%,#FDFCFA 52%,#F8F5EF 100%);
  box-shadow:inset 0 1px 0 #fff,0 0 0 1px rgba(191,145,58,.32),0 7px 16px rgba(20,38,90,.055),0 20px 38px rgba(20,38,90,.08);transition:transform .15s}
.gcard:active{transform:scale(.98)}
.gcard .ic{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;margin-bottom:4px;
  background:radial-gradient(circle at 50% 28%,#FFFFFF 0%,#FEFBF5 55%,#F7F1E4 100%);box-shadow:0 0 0 1.5px rgba(191,145,58,.42),0 0 0 8px rgba(191,145,58,.06)}
.gcard .ic svg{width:36px;height:36px;stroke:var(--gold)}
.gcard b{font-size:30px;line-height:40px}
.gcard p{font-size:22px;line-height:32px;color:var(--ink-muted);min-height:64px}
.gcard .meta{display:flex;gap:8px;margin-top:4px}
.chip{font-size:20px;font-weight:600;line-height:36px;padding:0 14px;border-radius:99px;background:rgba(20,38,90,.06);color:var(--ink-muted)}
.chip.on{background:var(--green-050);color:#0F6B51}

/* หน้าในหมวด */
.back{display:inline-flex;align-items:center;gap:10px;height:64px;padding:0 28px 0 20px;border-radius:99px;border:0;cursor:pointer;
  background:#fff;box-shadow:0 0 0 1.5px var(--line);font-size:24px;font-weight:600;color:var(--ink-muted)}
.back svg{width:28px;height:28px;stroke:var(--ink-muted)}
.ghead{display:flex;align-items:center;gap:20px;margin:28px 0 8px}
.ghead h2{font-size:44px;font-weight:700;line-height:56px}
.ghead p{font-size:24px;color:var(--ink-muted);line-height:34px}
.sec{margin-top:32px}
.sec h3{font-size:24px;font-weight:700;color:var(--gold);letter-spacing:.3px;margin:0 0 12px 8px}
.card{border-radius:24px;padding:0 32px;background:linear-gradient(176deg,#FFFFFF 0%,#FDFCFA 52%,#F8F5EF 100%);
  box-shadow:inset 0 1px 0 #fff,0 0 0 1px rgba(191,145,58,.32),0 7px 16px rgba(20,38,90,.055)}
.row{display:flex;align-items:center;gap:24px;min-height:104px;padding:20px 0}
.row + .row{border-top:1px solid rgba(20,38,90,.08)}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:28px;font-weight:500;line-height:40px}
.row .tx small{display:block;font-size:22px;line-height:32px;color:var(--ink-soft)}
.row .crumb{display:block;font-size:20px;line-height:28px;color:var(--gold);font-weight:600}
/* สวิตช์ใหญ่ แตะง่ายบนจอสัมผัส */
.sw{position:relative;flex:none;width:96px;height:56px;border-radius:99px;border:0;cursor:pointer;background:#D5DCE6;transition:background .2s}
.sw::after{content:"";position:absolute;left:6px;top:6px;width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(20,38,90,.25);transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.sw[aria-checked="true"]{background:linear-gradient(135deg,#223A7A,var(--ink))}
.sw[aria-checked="true"]::after{transform:translateX(40px)}
.val{flex:none;width:380px;height:64px;border-radius:16px;border:1.5px solid var(--line);background:#fff;padding:0 20px;
  font:inherit;font-size:24px;color:var(--ink);outline:0;text-overflow:ellipsis}
.val:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(30,123,224,.12)}
.act{flex:none;height:64px;padding:0 28px;border-radius:99px;border:0;cursor:pointer;background:var(--gold-050);color:#8A6420;font-size:24px;font-weight:600;
  box-shadow:0 0 0 1.5px rgba(191,145,58,.35)}
/* การเชื่อมต่อเซิร์ฟเวอร์ (เดิมเป็นหน้าแยก "เชื่อมต่อ" IP/Port) — การ์ดแรกของหน้าตั้งค่า ตู้ใช้งานไม่ได้ถ้าค่านี้ผิด */
.srv{padding:32px;border-radius:32px;margin-bottom:40px;background:linear-gradient(176deg,#FFFFFF 0%,#FDFCFA 52%,#F8F5EF 100%);
  box-shadow:inset 0 1px 0 #fff,0 0 0 1px rgba(191,145,58,.32),0 7px 16px rgba(20,38,90,.055),0 20px 38px rgba(20,38,90,.08)}
.srv .top{display:flex;align-items:center;gap:20px}
.srv .ic{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:radial-gradient(circle at 50% 28%,#FFFFFF 0%,#FEFBF5 55%,#F7F1E4 100%);box-shadow:0 0 0 1.5px rgba(191,145,58,.42),0 0 0 8px rgba(191,145,58,.06)}
.srv .ic svg{width:36px;height:36px;stroke:var(--gold)}
.srv b{font-size:30px;line-height:40px;display:block}
.srv small{font-size:22px;line-height:32px;color:var(--ink-muted)}
.st{margin-left:auto;display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 20px;border-radius:99px;font-size:22px;font-weight:600;white-space:nowrap}
.st i{width:12px;height:12px;border-radius:50%;background:currentColor}
.st.ok{background:var(--green-050);color:#0F6B51}.st.bad{background:#FEF3F2;color:#B42318}.st.busy{background:var(--blue-050);color:var(--blue-deep)}
.srv .f{display:flex;gap:16px;margin-top:24px;align-items:flex-end}
.srv label{display:flex;flex-direction:column;gap:8px;font-size:22px;color:var(--ink-soft)}
.srv label.ip{flex:1}.srv label.pt{width:200px}
.srv .val{width:100%;height:72px;font-size:28px;font-variant-numeric:tabular-nums}
.srv .go{flex:none;height:72px;padding:0 32px;border-radius:99px;border:0;cursor:pointer;color:#fff;font-size:26px;font-weight:700;
  background:linear-gradient(135deg,#223A7A,var(--ink));box-shadow:0 10px 24px rgba(20,38,90,.22)}
.empty{padding:80px 0;text-align:center;color:var(--ink-muted);font-size:28px}
mark{background:#FFE9A8;color:inherit;border-radius:4px}
/* แจ้งบันทึกแล้ว */
/* toast อยู่บนจุดเดียวกันทุกหน้า (y296 เหมือนป้ายแจ้งผลบนหน้าแรก) · ไม่อยู่ล่างเพราะแป้นพิมพ์/มือบังตอนกดปุ่ม */
.toast{position:absolute;left:50%;top:296px;z-index:9;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:18px 32px;border-radius:99px;
  background:linear-gradient(135deg,#223A7A,var(--ink));color:#fff;font-size:26px;font-weight:600;box-shadow:0 16px 40px rgba(20,38,90,.3);pointer-events:none;transition:opacity .25s}
.toast svg{width:30px;height:30px;stroke:#fff}
.toast[hidden]{display:flex;opacity:0}
</style>
</head>

    return (srvHit() ? srvCard() : '') + `<div class="lbl">ผลการค้นหา ${r.length} รายการ</div>` + (r.length ? `<div class="card">${r.map(i => row(i, true)).join('')}</div>` : `<div class="empty">ไม่พบการตั้งค่าที่ค้นหา</div>`);
  }
  if (OPEN){
    const g = DATA.find(x => x.id === OPEN);
    return `<button class="back" data-back>${ic(I.back, 2.2)}หมวดทั้งหมด</button>
      <div class="ghead"><span class="gic" style="width:88px;height:88px;border-radius:50%;display:grid;place-items:center;flex:none;background:radial-gradient(circle at 50% 28%,#fff,#FEFBF5 55%,#F7F1E4);box-shadow:0 0 0 1.5px rgba(191,145,58,.42)">${ic(g.ic).replace('<svg','<svg style="width:44px;height:44px;stroke:#A87C2A"')}</span>
        <div><h2>${esc(g.name)}</h2><p>${esc(g.desc)}</p></div></div>
      ${g.secs.map(s => `<div class="sec"><h3>${esc(s.t)}</h3><div class="card">${s.items.map(i => row(i)).join('')}</div></div>`).join('')}`;
  }
  return srvCard() + `<div class="lbl">หมวดการตั้งค่า</div><div class="grid">${DATA.map(g => {
    const it = g.secs.flatMap(s => s.items), on = it.filter(i => i.k === 't' && i.on).length;
    return `<button class="gcard" data-g="${g.id}"><span class="ic">${ic(g.ic)}</span><b>${esc(g.name)}</b><p>${esc(g.desc)}</p>
      <span class="meta"><span class="chip">${it.length} รายการ</span>${on ? `<span class="chip on">เปิดอยู่ ${on}</span>` : ''}</span></button>`; }).join('')}</div>`;
}
function render(keepScroll){
  const scr = document.getElementById('screen');
  const b0 = scr.querySelector('.body'), st = keepScroll && b0 ? b0.scrollTop : 0;
  const had = document.activeElement && document.activeElement.id === 'q';
  scr.innerHTML = `
    <div class="hd">
      <div class="top"><span class="gic">${ic(I.gear)}</span>
        <div><h1>ตั้งค่าตู้</h1><div class="sub">V.24.09.69 · แก้ไขแล้วบันทึกทันที</div></div>
        <button class="x" data-exit aria-label="ออกจากหน้าตั้งค่า">${ic(I.x, 2.2)}</button></div>
      <label class="search">${ic(I.search, 2)}<input id="q" value="${esc(Q)}" placeholder="ค้นหา เช่น Authen, Scan HN, เครื่องพิมพ์" autocomplete="off">
        ${Q ? `<button class="clr" data-clr aria-label="ล้างคำค้นหา">${ic(I.x, 2.4)}</button>` : ''}</label>
    </div>
    <div class="body">${body()}</div>
    <div class="toast" id="toast" hidden>${ic(I.check, 2.6)}<span id="toastT">บันทึกแล้ว</span></div>`;
  const q = scr.querySelector('#q');
  if (had){ q.focus(); q.setSelectionRange(Q.length, Q.length); }
  q.oninput = () => { Q = q.value.trim(); render(); };
  scr.querySelector('.body').scrollTop = st;
  scr.querySelectorAll('[data-g]').forEach(el => el.onclick = () => { OPEN = el.dataset.g; render(); });
  scr.querySelectorAll('[data-back]').forEach(el => el.onclick = () => { OPEN = null; render(); });
  scr.querySelectorAll('[data-clr]').forEach(el => el.onclick = () => { Q = ''; render(); });
  scr.querySelectorAll('[data-exit]').forEach(el => el.onclick = () => { location.href = 'welcome_v2.html'; });
  scr.querySelectorAll('.sw').forEach(el => el.onclick = () => { const i = all()[el.dataset.id]; i.on = !i.on; el.setAttribute('aria-checked', i.on); toast(); });
  scr.querySelectorAll('.val').forEach(el => el.onchange = () => { all()[el.dataset.id].v = el.value; toast(); });
  scr.querySelectorAll('[data-act]').forEach(el => el.onclick = () => toast('ส่งคำสั่งแล้ว'));
  const go = scr.querySelector('#srvGo');
  if (go) go.onclick = () => {
    SRV.ip = scr.querySelector('#srvIp').value.trim(); SRV.port = scr.querySelector('#srvPort').value.trim();
    SRV.st = 'busy'; render(true);
    /* ต้นแบบ: IP 4 ส่วน + Port เป็นตัวเลข = เชื่อมต่อได้ */
    setTimeout(() => { SRV.st = /^\d{1,3}(\.\d{1,3}){3}$/.test(SRV.ip) && /^\d{2,5}$/.test(SRV.port) ? 'ok' : 'bad'; render(true); toast(SRV.st === 'ok' ? 'เชื่อมต่อเซิร์ฟเวอร์แล้ว' : 'เชื่อมต่อไม่ได้ ตรวจสอบ IP / Port'); }, 1200);
  };
  fit();
}
function toast(t = 'บันทึกแล้ว'){
  const el = document.getElementById('toast'); document.getElementById('toastT').textContent = t;
  el.hidden = false; clearTimeout(window._tt); window._tt = setTimeout(() => el.hidden = true, 1400);
}
function fit(){
  const st = document.getElementById('stage');
  const bleed = innerHeight / innerWidth >= 1600 / 1080;
  document.body.classList.toggle('bleed', bleed);
  const s = bleed ? innerWidth / 1080 : Math.min((innerWidth - 40) / 1080, (innerHeight - 40) / 1920);
  const H = bleed ? innerHeight / s : 1920;
  st.style.setProperty('--H', H + 'px'); st.style.transform = `scale(${s})`; st.style.height = (H * s) + 'px';
}
addEventListener('resize', fit);
render();
</script>
<script>
if (['localhost','127.0.0.1'].includes(location.hostname)) {
  let stamp = null;
  setInterval(async () => { try { const r = await fetch(location.pathname, {method:'HEAD', cache:'no-store'}); const m = r.headers.get('last-modified'); if (stamp && m !== stamp) location.reload(); stamp = m; } catch (e) {} }, 1000);
}
</script>
<script src="idle.js"></script>
