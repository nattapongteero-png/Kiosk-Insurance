}

/* ---------- หน้าเทียบ ---------- */
body{background:#1B2028;color:#E8EDF5;font-family:"Sarabun",system-ui,sans-serif;padding:36px 28px 72px}
.intro{max-width:1540px;margin:0 auto 28px}
.intro h1{font-size:30px;font-weight:700;color:#fff}
.intro .sub{font-size:18px;color:#AEB9CB;margin-top:6px;line-height:1.5}
.opts{max-width:1540px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(470px,1fr));gap:48px 28px;justify-items:center}
.opt{width:454px}
.opt > h2{font-size:22px;font-weight:700;color:#fff;display:flex;align-items:center;gap:10px;margin-bottom:12px}
.opt > h2 .k{min-width:34px;height:34px;padding:0 8px;border-radius:9px;background:#3A4656;display:grid;place-items:center;font-size:16px}
.frame{--s:.42;width:calc(1080px * var(--s));height:calc(1920px * var(--s));position:relative;overflow:hidden;border-radius:16px;box-shadow:0 22px 50px rgba(0,0,0,.5);background:#EAF2FB}
.frame .pp{inset:auto;left:0;top:0;width:1080px;height:1920px;transform:scale(var(--s));transform-origin:0 0}
.frame iframe{display:block;width:100%;height:100%;border:0}
.opt .full{display:inline-block;margin-top:10px;font-size:15px;color:#9CC3FF;text-decoration:none}
.why{margin-top:10px;font-size:16px;line-height:1.55;color:#C9D2E0}
.why > p{color:#E8EDF5}
.why ul{list-style:none;margin-top:8px;display:grid;gap:5px}
.why li{padding-left:22px;position:relative}
.why li.y::before{content:"✓";position:absolute;left:0;color:#5FD39B;font-weight:700}
.why li.n::before{content:"!";position:absolute;left:5px;color:#F2B84B;font-weight:700}
body.fullmode{padding:0;min-height:100vh;display:grid;place-items:center;background:#111}
body.fullmode .intro,body.fullmode .opt > :not(.frame){display:none}
body.fullmode .opts{display:block}
body.fullmode .opt{width:auto}
body.fullmode .frame{border-radius:0}

/* ---------- ชิ้นส่วนร่วม ---------- */
.pp .rec{position:relative;padding:8px var(--gutter) 16px}
.pp .rec .hd{margin-bottom:28px}
.pp .rec .hd p b{color:var(--ink)}
.pp .more{padding:48px var(--gutter) 336px}
.ty{display:inline-flex;align-items:center;gap:8px;padding:4px 14px 4px 10px;border-radius:99px;background:rgba(255,255,255,.94);
  font-size:20px;font-weight:700;color:var(--deep);white-space:nowrap}
.ty::before{content:"";width:10px;height:10px;border-radius:50%;background:currentColor}
/* ภาพปก = พื้นสีแบรนด์บริษัทประกัน + โลโก้สีขาวตรงกลาง · โลโก้มีที่นี่ที่เดียว */
.ph{position:relative;border-radius:16px;overflow:hidden;background:radial-gradient(120% 140% at 18% 0%,rgba(255,255,255,.20),rgba(255,255,255,0) 62%),var(--brand)}
.ph .brand{position:absolute;left:50%;top:54%;height:var(--lh,44px);width:auto;transform:translate(-50%,-50%);pointer-events:none;-webkit-user-drag:none;filter:brightness(0) invert(1)}
.ph .ty{position:absolute;left:10px;top:10px}
.wt{display:inline-flex;align-items:center;gap:8px;font-size:24px;font-weight:600;color:#7A5717}
.wt svg{width:26px;height:26px;stroke:#A87C2A}
/* แผงรายละเอียดเต็มกว้าง: โลโก้ + บริษัท · ป้ายอายุ · ตัวเลขเด่น 3 ข้อ · เฉลี่ยรายเดือน + ปุ่ม */
.det{background:#fff;padding:28px 36px 30px}
.det h3{display:flex;align-items:center;gap:14px;font-size:32px;font-weight:700}
.lg{width:52px;height:52px;border-radius:50%;flex:none;position:relative;overflow:hidden;background:#fff;
  box-shadow:0 0 0 1.5px rgba(191,145,58,.42),0 0 0 5px rgba(191,145,58,.06)}
.lg img{position:absolute;inset:8px;width:36px;height:36px;object-fit:contain}
.fit{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px 10px}
.fit span{display:inline-flex;align-items:center;gap:6px;padding:5px 14px 5px 9px;border-radius:99px;background:var(--tint);font-size:22px;font-weight:600;white-space:nowrap}
.fit svg{width:22px;height:22px;stroke:var(--deep)}
.ben{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:24px}
.ben > div{display:flex;flex-direction:column;min-width:0}
.ben i{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--tint);margin-bottom:10px}
.ben i svg{width:26px;height:26px;stroke:var(--deep)}
.ben strong{font-size:36px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.ben strong em{font-style:normal;font-size:22px;font-weight:600;margin-left:6px;color:var(--ink-muted)}
.ben strong.t{font-size:28px;line-height:1.25;white-space:normal}
.ben span{margin-top:6px;font-size:23px;line-height:1.3;color:#34466F;text-wrap:pretty}
.ben small{font-size:21px;line-height:1.3;color:var(--ink-muted)}
.buy{display:flex;align-items:center;gap:16px;margin-top:22px;padding-top:20px;border-top:1px solid rgba(20,38,90,.08)}
.buy .mo{flex:1;font-size:24px;color:var(--ink-muted);white-space:nowrap}
.buy .mo{display:flex;flex-direction:column;line-height:1.2}   /* 2 บรรทัด: ป้าย "เฉลี่ย" / ตัวเลข + หน่วย · เหลือที่ให้ปุ่ม */
.buy .mo small{font-size:22px}
.buy .mo b{font-size:34px;font-weight:700;color:var(--ink);margin-right:8px;font-variant-numeric:tabular-nums}
.btn{height:84px;padding:0 30px;border:0;border-radius:99px;font:inherit;font-size:28px;font-weight:700;cursor:pointer;white-space:nowrap;color:var(--ink)}
.btn.sec{background:#fff;box-shadow:inset 0 0 0 2px rgba(20,38,90,.2)}
.btn.pri{color:#fff;background:linear-gradient(180deg,#223A7A 0%,var(--ink) 100%);box-shadow:0 2px 6px rgba(20,38,90,.2)}
.sheet{filter:drop-shadow(0 0 1px rgba(20,38,90,.24)) drop-shadow(0 1px 2px rgba(20,38,90,.06)) drop-shadow(0 4px 12px rgba(20,38,90,.08))}
.arw{position:absolute;z-index:20;width:60px;height:60px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;
  background:#fff;box-shadow:0 0 0 1px rgba(20,38,90,.12),0 4px 12px rgba(20,38,90,.16)}
.arw svg{width:30px;height:30px;stroke:var(--ink)}
.arw[hidden]{display:none}

/* ---------- H · แนวนอน: แถวการ์ดด้านบน (ปัดซ้าย-ขวา) + แผงรายละเอียดเต็มกว้างด้านล่าง
   การ์ดที่เลือก + แผง = แผ่นขาวผืนเดียว วาดเป็นรูปทรงเดียวด้วย SVG (.sheetbg) อยู่ด้านหลัง (วิธีเดียวกับแบบแนวตั้ง)
   ขอบนอกมุมโค้ง 24 · รอยต่อมุมเว้า 24 · เส้นขอบ + เงาวาดรอบรูปทรงรวม ไม่มีตะเข็บ
   แตะเปลี่ยนแผน = รูปทรงค่อยๆ เลื่อนไปหาการ์ดใหม่ · ปัดแถว = รูปทรงเลื่อนตามการ์ดที่เลือก ---------- */
.oH .wrap{position:relative}
.oH .sheetbg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:0;
  filter:drop-shadow(0 1px 2px rgba(20,38,90,.06)) drop-shadow(0 4px 12px rgba(20,38,90,.08))}
.oH .sheetbg path{fill:#fff;stroke:rgba(20,38,90,.11);stroke-width:1.5;transition:d .38s cubic-bezier(.3,.7,.2,1)}
.oH .rowbox{position:relative;z-index:1}
.oH .strip{position:relative;display:flex;align-items:stretch;gap:24px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;
  padding:4px 0 8px;touch-action:pan-x pan-y}
.oH .strip::-webkit-scrollbar{display:none}
/* การ์ด = หัวเรื่อง: ภาพ (ป้ายประเภท) + ชื่อแผน + เบี้ย · 3 ใบเต็ม + ใบที่ 4 โผล่ให้รู้ว่าปัดต่อได้ */
.oH .card{position:relative;flex:0 0 272px;scroll-snap-align:start;display:flex;flex-direction:column;border:0;padding:12px;font:inherit;text-align:left;cursor:pointer;color:var(--ink);
  border-radius:22px;background:rgba(255,255,255,.8);box-shadow:0 0 0 1px rgba(20,38,90,.10),0 1px 3px rgba(20,38,90,.07);
  transition:transform .2s cubic-bezier(.2,.8,.2,1);-webkit-user-drag:none;user-select:none}
.oH .card:active{transform:scale(.98)}

/* ---------- H · แนวนอน ---------- */
/* path รวม "การ์ดที่เลือก (ด้านบน) + แผง (ด้านล่าง)" พิกัดภายใน .wrap · คำสั่งชุดเดียวกันเสมอ (มุมที่ไม่ใช้ = รัศมี 0) ให้ transition ของ d ลื่น
   แผง (x0..x1, y0..y1) · การ์ด (tx0..tx1, ty0..y0) · การ์ดชิดขอบแผง → มุมฝั่งนั้นเป็น 0 = เส้นตรง */
function tabPathH(x0, x1, y0, y1, tx0, tx1, ty0){
  const R = 24, F = 24, n = v => Math.round(v * 10) / 10;
  const w = Math.max(0, tx1 - tx0), rt = Math.min(R, w / 2), dl = Math.max(0, tx0 - x0), dr = Math.max(0, x1 - tx1);
  const fL = Math.min(F, dl / 2), rL = Math.min(R, dl / 2), fR = Math.min(F, dr / 2), rR = Math.min(R, dr / 2);
  return `M${n(tx0+rt)} ${n(ty0)}H${n(tx1-rt)}A${n(rt)} ${n(rt)} 0 0 1 ${n(tx1)} ${n(ty0+rt)}V${n(y0-fR)}A${n(fR)} ${n(fR)} 0 0 0 ${n(tx1+fR)} ${n(y0)}`
    + `H${n(x1-rR)}A${n(rR)} ${n(rR)} 0 0 1 ${n(x1)} ${n(y0+rR)}V${n(y1-R)}A${R} ${R} 0 0 1 ${n(x1-R)} ${n(y1)}H${n(x0+R)}A${R} ${R} 0 0 1 ${n(x0)} ${n(y1-R)}`
    + `V${n(y0+rL)}A${n(rL)} ${n(rL)} 0 0 1 ${n(x0+rL)} ${n(y0)}H${n(tx0-fL)}A${n(fL)} ${n(fL)} 0 0 0 ${n(tx0)} ${n(y0-fL)}V${n(ty0+rt)}A${n(rt)} ${n(rt)} 0 0 1 ${n(tx0+rt)} ${n(ty0)}Z`;
}
const cardH = (q, i, on) => `<button class="card${on ? ' on' : ''}" data-i="${i}" aria-pressed="${on}" style="${vars(q)}">
  <span class="ph"><img class="brand" src="ins_logo_c.png" alt="AIA"><span class="ty">${q.tag}</span><span class="ck">${svg('check', 3)}</span></span>
  <span class="cap"><b>${q.name}</b><span class="p">${price(q)}</span></span></button>`;
function mountH(frame){
  let cur = 0, prog = false, progT = null, target = 0;
  frame.innerHTML = screen(`<section class="rec oH">
    <div class="hd"><h2>ข้อเสนอแนะนำ</h2><p>ท่านเข้าเกณฑ์ <b>${P.length} แผน</b> · แตะแผนเพื่อดูรายละเอียด ปัดซ้าย-ขวาดูแผนอื่น</p></div>
    <div class="wrap">
      <svg class="sheetbg" aria-hidden="true"><path/></svg>
      <div class="rowbox">
        <div class="strip">${P.map((q, i) => cardH(q, i, i === cur)).join('')}</div>
        <span class="fadeR"></span>
      </div>
      <div class="det" aria-live="polite"></div>
    </div></section>`);
  const wrap = frame.querySelector('.wrap'), row = frame.querySelector('.rowbox'), strip = frame.querySelector('.strip'), det = frame.querySelector('.det');
  const path = frame.querySelector('.sheetbg path'), cards = [...strip.children];
  const fade = frame.querySelector('.fadeR');
  const fill = () => { det.setAttribute('style', vars(P[cur])); det.innerHTML = detail(P[cur]); };
  /* วาดแผ่น: ตำแหน่งการ์ดคิดจาก scrollLeft ที่ให้มา (ระหว่างเลื่อนอัตโนมัติใช้ค่าปลายทาง) · ส่วนที่เลื่อนพ้นแถวถูกตัดออก */
  const sync = (animate, sl = strip.scrollLeft) => {
    const c = cards[cur], x0 = 0, x1 = wrap.clientWidth, y0 = det.offsetTop, y1 = y0 + det.offsetHeight;
    const cx = row.offsetLeft + strip.offsetLeft + c.offsetLeft - sl, clamp = v => Math.max(x0, Math.min(x1, v));
    const d = `path("${tabPathH(x0, x1, y0, y1, clamp(cx), clamp(cx + c.offsetWidth), row.offsetTop + strip.offsetTop + c.offsetTop)}")`;
    if (!animate) path.style.transition = 'none';
    path.style.d = d;
    if (!animate){ void path.getBoundingClientRect(); path.style.transition = ''; }
  };
  const arrows = () => { fade.hidden = strip.scrollLeft > strip.scrollWidth - strip.clientWidth - 8; };   /* ขอบขวาจาง = ยังมีแผนต่อ · สุดทางแล้วซ่อน */
  strip.addEventListener('scroll', () => { arrows(); if (!prog) sync(false); });
  /* ตำแหน่งเลื่อนที่ทำให้เห็นการ์ดทั้งใบ (เลือกจากจุด snap = ขอบซ้ายการ์ด) · เห็นครบอยู่แล้ว = ไม่เลื่อน */
  const scrollFor = c => { const sl = strip.scrollLeft, cw = strip.clientWidth, max = strip.scrollWidth - cw, L = c.offsetLeft, R = L + c.offsetWidth;
    if (L >= sl - 1 && R <= sl + cw + 1) return sl;
    const snaps = [...new Set(cards.map(k => Math.min(k.offsetLeft, max)))].filter(s => L >= s - 1 && R <= s + cw + 1);
    return snaps.length ? snaps.reduce((a, b) => Math.abs(b - sl) < Math.abs(a - sl) ? b : a) : Math.min(L, max); };
  const select = i => {
    if (i === cur) return;
    cur = i;
    cards.forEach((c, k) => { c.classList.toggle('on', k === i); c.setAttribute('aria-pressed', k === i); });
    det.classList.add('swap'); fill(); void det.offsetWidth; det.classList.remove('swap');
    target = scrollFor(cards[i]);
    if (Math.abs(target - strip.scrollLeft) > 1){
      prog = true; strip.scrollTo({left: target, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
      clearTimeout(progT); progT = setTimeout(() => { prog = false; sync(false); }, 650);
    }
    sync(true, target);
  };
  /* เลื่อนเองเมื่อยังไม่มีคนแตะ: ทุก 5 วิ เลือกการ์ดใบถัดไป (แผ่นเลื่อนตาม + แถวเลื่อนให้เห็นทั้งใบ · ใบสุดท้ายวนกลับใบแรก)
     ให้ผู้ใช้เห็นว่าแถวปัดได้และการ์ดแตะเลือกได้ · แตะ/ปัด/เลื่อนครั้งแรก = หยุดเลื่อนเองถาวร ไม่เปลี่ยนการ์ดขณะกำลังอ่าน */
  const AUTO = 5000; let auto = !matchMedia('(prefers-reduced-motion: reduce)').matches, autoT = null;
  const stopAuto = () => { auto = false; clearTimeout(autoT); };
  const autoNext = () => { clearTimeout(autoT); if (auto) autoT = setTimeout(() => { if (!auto || !frame.isConnected) return; select((cur + 1) % P.length); autoNext(); }, AUTO); };
  frame.addEventListener('pointerdown', stopAuto, true);
  frame.addEventListener('wheel', stopAuto, {capture: true, passive: true});
  /* ลากด้วยเมาส์ได้ (บนจอสัมผัสปัดได้เองอยู่แล้ว) · ลากเกิน 6px = ไม่นับเป็นการแตะเลือก */
  let x0 = null, s0 = 0, moved = false;
  const sc = () => parseFloat(getComputedStyle(frame).getPropertyValue('--s')) || 1;
  strip.addEventListener('pointerdown', e => { if (e.pointerType === 'touch') return; x0 = e.clientX; s0 = strip.scrollLeft; moved = false; });
  strip.addEventListener('pointermove', e => { if (x0 === null) return; const dx = (e.clientX - x0) / sc();
    if (!moved && Math.abs(dx) > 6){ moved = true; strip.style.scrollSnapType = 'none'; } if (moved) strip.scrollLeft = s0 - dx; });
  addEventListener('pointerup', () => { if (x0 === null) return; x0 = null;
    if (moved){ const sl = strip.scrollLeft; strip.style.scrollSnapType = ''; strip.scrollLeft = sl; } });
  strip.addEventListener('click', e => { if (moved){ e.stopPropagation(); moved = false; return; } const c = e.target.closest('[data-i]'); if (c) select(+c.dataset.i); }, true);
  /* ขนาดเปลี่ยน (ฟอนต์โหลดเสร็จ · เนื้อหาแผงเปลี่ยน) → วาดใหม่ */
  new ResizeObserver(() => sync(true, prog ? target : strip.scrollLeft)).observe(det);
  fill(); arrows(); sync(false);
  if (document.fonts) document.fonts.ready.then(() => sync(false));
  autoNext();
}

/* ---------- N · แบบ Netflix ---------- */
/* การ์ดใบเดียวครบทุกข้อมูล: ภาพ · ชื่อแผน/เบี้ย · บริษัท · ป้ายอายุ · ตัวเลขเด่น · เฉลี่ยรายเดือน + ปุ่ม */
const slideCard = (p, i) => `<div class="slide" data-i="${i}" role="group" aria-label="${p.name}" style="${vars(p)}">${ph(p, 190)}
  <div class="hdr"><b>${p.name}</b><span class="p">${p.pend ? `<span class="wt">${svg('clock', 2)}รอผลพิจารณา</span>` : `<strong>${p.pr}</strong>บาท/ปี`}</span></div>
  <div class="bd">
    <div class="co">บริษัท เอไอเอ จำกัด</div>
    ${p.fit.length ? `<div class="fit">${p.fit.map(f => `<span>${svg('check', 2.8)}${f}</span>`).join('')}</div>` : ''}
    <div class="ben">${p.rows.map(r => `<div><i>${svg(r.ic)}</i>${r.num ? `<strong>${r.num}${r.unit ? `<em>${r.unit}</em>` : ''}</strong>`
      : `<strong class="t">${r.v}</strong>`}<span>${r.k}</span>${r.sub ? `<small>${r.sub}</small>` : ''}</div>`).join('')}</div>
    <div class="buy"><span class="mo">${p.pend ? 'รอผลพิจารณา' : `<small>เฉลี่ย</small><span><b>${perMonth(p)}</b>บาท/เดือน</span>`}</span>
      <button class="btn sec">ดูรายละเอียด</button>${p.pend ? '' : '<button class="btn pri">สนใจแผนนี้</button>'}</div>
  </div></div>`;
function mountN(frame){
  const DUR = 6000;   /* เลื่อนเองทุก 6 วิ เฉพาะก่อนผู้ใช้แตะครั้งแรก (ดึงความสนใจ) · แตะ/ปัด/กดปุ่มครั้งแรก = หยุดเลื่อนเองถาวร ไม่เปลี่ยนการ์ดขณะกำลังอ่าน */
  let cur = 0, timer = null, paused = false;
  frame.innerHTML = screen(`<section class="rec oN">
    <div class="hd"><h2>ข้อเสนอแนะนำ</h2><p>ท่านเข้าเกณฑ์ <b>${P.length} แผน</b> · แผนจะเลื่อนให้ดูเอง แตะหรือปัดเพื่อเลือก</p></div>
    <div class="stage">${P.map(slideCard).join('')}
      </div>
    <div class="ctl"><button class="arw prev" aria-label="แผนก่อนหน้า">${svg('chevL', 2.6)}</button>
      <div class="dots">${P.map(() => '<i></i>').join('')}</div>
      <button class="arw next" aria-label="แผนถัดไป">${svg('chevR', 2.6)}</button></div>
    <div class="hint">${svg('hand', 1.8)}ปัดซ้าย-ขวา หรือแตะการ์ดข้างๆ</div></section>`);
  const stage = frame.querySelector('.stage'), slides = [...stage.querySelectorAll('.slide')], dots = frame.querySelector('.dots');
  const n = P.length, GAP = 650;   /* ใบข้างโผล่ราว 200px ต่อข้าง */
  const wrap = k => ((k % n) + n) % n;
  const layout = (dx = 0) => slides.forEach((el, i) => {
    let k = wrap(i - cur); if (k > n / 2) k -= n;                       /* ระยะจากใบกลาง แบบวนรอบ */
    const a = Math.abs(k);
    el.style.transform = `translateX(${k * GAP + dx}px) scale(${a === 0 ? 1 : .86})`;
    el.style.opacity = a === 0 ? 1 : a === 1 ? .5 : 0;
    el.style.zIndex = 10 - a; el.classList.toggle('cur', a === 0);
    el.style.pointerEvents = a > 1 ? 'none' : '';
    el.querySelectorAll('button').forEach(b => b.tabIndex = a === 0 ? 0 : -1);   /* ปุ่มกดได้เฉพาะใบกลาง */
  });
  const dotsPaint = () => { [...dots.children].forEach((d, i) => d.classList.toggle('cur', i === cur));
    dots.style.setProperty('--dur', DUR + 'ms'); const c = dots.children[cur]; c.classList.remove('cur'); void c.offsetWidth; c.classList.add('cur'); };
  const go = k => { cur = wrap(k); layout(); dotsPaint(); };
  const tick = () => { clearTimeout(timer); if (!paused) timer = setTimeout(() => { go(cur + 1); tick(); }, DUR); };
  const userAct = () => { paused = true; dots.classList.add('paused'); clearTimeout(timer); };
  frame.querySelector('.prev').onclick = e => { e.stopPropagation(); userAct(); go(cur - 1); };
  frame.querySelector('.next').onclick = e => { e.stopPropagation(); userAct(); go(cur + 1); };
  /* ปัด/ลาก: เลื่อนตามนิ้ว ปล่อยแล้วเกิน 80px = ไปใบถัดไป/ก่อนหน้า · แตะใบข้าง = เลื่อนใบนั้นมากลาง · แตะใบกลาง = หยุดเลื่อนเอง (กำลังอ่าน) */
  let x0 = null, dx = 0;
  const sc = () => parseFloat(getComputedStyle(frame).getPropertyValue('--s')) || 1;
  stage.addEventListener('pointerdown', e => { if (e.target.closest('.arw')) return; x0 = e.clientX; dx = 0; stage.classList.add('drag'); });
  stage.addEventListener('pointermove', e => { if (x0 === null) return; dx = (e.clientX - x0) / sc(); if (Math.abs(dx) > 8) layout(dx); });
  addEventListener('pointerup', e => { if (x0 === null) return; stage.classList.remove('drag'); x0 = null; userAct();
    if (Math.abs(dx) > 80) go(cur + (dx < 0 ? 1 : -1));
    else { const s = e.target.closest && e.target.closest('.slide'); if (s && Math.abs(dx) < 8 && +s.dataset.i !== cur) go(+s.dataset.i); else layout(); } });
  /* ครั้งแรก: วางการ์ดเข้าที่ทันที (ไม่เลื่อนเข้ามา) */
  stage.classList.add('drag'); layout(); void stage.offsetWidth; stage.classList.remove('drag');
  dotsPaint(); tick();
}

   idea:'ข้อมูลทั้งหมดของแผนอยู่ในการ์ดใบเดียว ใบที่โฟกัสอยู่กลาง ใบข้างย่อและจาง ก่อนผู้ใช้แตะ การ์ดจะเลื่อนเองทุก 6 วินาที (แถบใต้การ์ดนับถอยหลัง) พอแตะ ปัด หรือกดปุ่มครั้งแรก จะหยุดเลื่อนเองถาวร ปุ่มเลื่อนอยู่แถวควบคุมใต้การ์ด คู่กับจุดบอกตำแหน่ง',
   yes:['ทุกอย่างของแผนอยู่ในการ์ดเดียว ไม่ต้องมองสลับสองที่','การ์ดใหญ่ที่สุด ดึงความสนใจ · แผนเพิ่มกี่ตัวก็ได้ แถบวนรอบ','เลือกแผนได้ 3 ทาง: แตะใบข้าง · ปัด · ปุ่ม [<] [>] ใต้การ์ด'],
   no:['เห็นราคาทีละแผน เทียบหลายแผนยากกว่า','ก่อนแตะครั้งแรก การ์ดเปลี่ยนเอง คนที่ยืนอ่านเฉยๆ อาจอ่านไม่ทัน']},
];
const full = new URLSearchParams(location.search).get('full'), box = document.getElementById('opts');
OPTS.filter(o => !full || o.k === full).forEach(o => {
  const el = document.createElement('section'); el.className = 'opt';
  el.innerHTML = `<h2><span class="k">${o.k}</span>${o.title}</h2><div class="frame"></div>
    <a class="full" target="_blank" href="${o.iframe ? o.iframe : `?full=${o.k}`}">ดูขนาดจริง ↗</a>
    <div class="why"><p>${o.idea}</p><ul>${o.yes.map(x => `<li class="y">${x}</li>`).join('')}${o.no.map(x => `<li class="n">${x}</li>`).join('')}</ul></div>`;
  box.appendChild(el);
  const frame = el.querySelector('.frame');
  if (o.iframe) frame.innerHTML = `<iframe src="${o.iframe}" title="${o.title}"></iframe>`; else o.mount(frame);
});
if (full){
  document.body.classList.add('fullmode');
  const fitFull = () => document.querySelectorAll('.frame').forEach(fr => fr.style.setProperty('--s', Math.min(innerHeight / 1920, innerWidth / 1080)));
  addEventListener('resize', fitFull); fitFull();
}
</script>
